<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>작업계획서</title>
<!--
  ============================================================================
  Athena 작업계획서 — 결정 콘솔 + 계획서 뷰 (HTML 템플릿)
  ----------------------------------------------------------------------------
  이 파일 하나가 작업계획서의 라이프사이클 전체를 담는다.
    (1) 승인 전 → 머리(제목·요약·상태) 아래 "결정 콘솔"에서 선택지를 고르고
                  [이대로 진행] — 결정이 PLAN.leadPane(계획서를 만든 아테나 pane)에 바로
                  입력된다. .md 본문은 그 아래 "계획서 전문"으로 렌더링된다. 현황판 주소
                  (scripts/board.sh open <이 파일>)로 열어야 보낼 수 있고, 보낼 수 없으면
                  [프롬프트로 복사] 로 바뀐다
    (2) 확정 후 → 각 결정에 decided 값을 채우면 결정 카드가 "확정" 으로 잠기고(고른 것만
                  보이고 나머지는 접힘), 아래 .md 본문이 "읽기용 계획서"로 유지된다.
  색은 시스템 설정을 따른다 — 라이트는 현황판 종이색, 다크는 Athena Studio 앱과 같은 값.
  스타일 · 스크립트는 plan-html.mjs 가 계획서를 맞출 때마다 이 템플릿 것으로 바꿔 쓴다
  (PLAN · plan-md 두 블록만 그 계획서 것) — 기존 계획서도 다음 갱신 때 새 모양이 된다.

  사용법 (Team Lead):
  1) 이 파일을 plans/<유형>/YYYYMMDD-제목.html 로 복사한다 (md와 동일 파일명).
  2) 아래 두 블록만 채운다 — 스타일/스크립트(맨 아래)는 건드릴 필요 없다.
     ⚠️ 스크립트로 자동 치환할 때는 이 헤더 주석이 끝난 뒤에서만 찾아 바꾼다.
        주석 안의 블록 이름까지 매칭되면 주석 종료 표시가 먹혀 PLAN 전체가 주석에 갇히고
        브라우저에서 "PLAN is not defined" 로 빈 화면이 된다. (그래서 위 [A][B] 는 태그가 아닌 script#id 표기다)

     [A] script#plan-data 의 PLAN 객체
         - title/type/scope/mdFile/summary
         - leadPane : [이대로 진행] 이 보낼 pane id — 계획서를 만든 아테나, 리뷰 뒤 결정이면 그 작업 에이전트 (scripts/screen pane current, 예 'w2:p33')
         - decisions[] : .md "사용자 결정 사항"과 1:1
           · 승인 전: options[] 만 채운다 (decided 생략)
           · 확정 후: 각 결정에 decided 를 채운다
                      (택1이면 문자열, 복수면 배열) → 해당 결정이 "✅ 확정"으로 잠김

     [B] script#plan-md 안에 .md 본문을 그대로 붙여넣는다
         - 이 텍스트가 결정 콘솔 위에 렌더링되어 "보기 좋은 계획서"가 된다.
         - .md 가 단일 소스 — 수정 시 .md 와 이 블록을 같은 턴에 함께 갱신한다.
         - Checkpoint(Status/Progress/Next)만 바뀐 경우에도 이 블록은 동기화한다.
           단 decisions[] 는 승인된 결정이 바뀔 때만 건드린다.

  지원 마크다운: 제목(#~######), 굵게(**), 인라인코드(`), 코드펜스(```),
                 표(GFM), 목록(- * 1.), 인용(>), 구분선(---), 링크. (중첩목록 제외)
  ============================================================================
-->
<script id="plan-data">
const PLAN = {
  title: '[작업 제목]',
  type: 'feature',            // feature | bugfix | refactor
  scope: '양쪽',              // API / 프론트 / 양쪽
  mdFile: 'plans/feature/YYYYMMDD-제목.md',
  summary: '한 줄 요약 — 무엇을 왜 하는지.',
  leadPane: '',             // [이대로 진행] 이 보낼 아테나 pane id — 계획서를 만든 pane

  // .md "사용자 결정 사항" 과 1:1.
  // 승인 전: options 만. 확정 후: decided 채움(택1=문자열, 복수=배열).
  decisions: [
    {
      id: 'example-1',
      title: '[결정 항목 제목]',
      desc: '이 결정이 무엇에 영향을 주는지 한 줄 설명.',
      type: 'single',          // single (택1) | multi (복수 선택)
      required: true,
      options: [
        { label: '옵션 A', desc: '옵션 A 설명', recommended: true },
        { label: '옵션 B', desc: '옵션 B 설명' },
        { label: '옵션 C', desc: '옵션 C 설명' },
      ],
      // decided: '옵션 A',   // ← 확정되면 주석 해제하여 채운다
    },
    {
      id: 'example-2',
      title: '[두 번째 결정 항목]',
      desc: '복수 선택이 필요하면 type을 multi로.',
      type: 'multi',
      required: false,
      options: [
        { label: '항목 1', desc: '' },
        { label: '항목 2', desc: '' },
      ],
      // decided: ['항목 1', '항목 2'],
    },
  ],
}
</script>

<!-- [B] .md 본문을 그대로 붙여넣는다. 비워두면 본문 렌더링 영역이 숨겨진다. -->
<script id="plan-md" type="text/markdown">
</script>

<style>
  /* 색 — 라이트는 현황판 종이색, 다크는 Athena Studio 앱(src/renderer/style.css)과 같은 값. 시스템 설정(prefers-color-scheme)을 따른다 */
  :root {
    color-scheme: light;
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #faf8f4;
    --line: #e4e0d6;
    --line-strong: #d3cdc0;
    --text: #23211d;
    --muted: #77726a;
    --accent: #3b6fd8;
    --accent-weak: #edf2fc;
    --accent-ink: #ffffff;
    --ok: #2f9e62;
    --ok-weak: #eaf5ee;
    --warn: #b07a10;
    --code-bg: #eeebe4;
    --radius: 8px;
    --radius-sm: 6px;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', 'Segoe UI', 'Malgun Gothic', sans-serif;
    --font-mono: 'D2Coding', 'SF Mono', Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #16171a;
      --surface: #1f2125;
      --surface-2: #1b1c20;
      --line: #2e3137;
      --line-strong: #3b3e45;
      --text: #e8e6e1;
      --muted: #9a968e;
      --accent: #c9ad78;
      --accent-weak: #2d2a23;
      --accent-ink: #16171a;
      --ok: #86c7a3;
      --ok-weak: #1e2823;
      --warn: #dbb579;
      --code-bg: #191b1f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.6 var(--font-ui);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 120px; }
  @media (min-width: 720px) { .wrap { padding: 32px 24px 120px; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 머리 — 유형 · 범위 · 원본 링크 / 제목 / 요약 / 상태 줄 */
  header.plan-head { margin-bottom: 20px; }
  .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 600; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  }
  .badge.type { color: var(--text); }
  .badge.type::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .badge.type-bugfix::before { background: #d1463b; }
  .badge.type-refactor::before { background: #7a62c9; }
  .badge.type-task::before { background: var(--ok); }
  .md-link { margin-left: auto; color: var(--muted); font-size: 12px; }
  .md-link code { font-family: var(--font-mono); font-size: 11.5px; }
  .plan-head h1 { margin: 0; font-size: 20px; line-height: 1.35; letter-spacing: -.01em; }
  .plan-summary { color: var(--muted); margin: 6px 0 0; }
  .plan-summary:empty { display: none; }

  .statusbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 16px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    font-size: 13px;
  }
  .statusbar .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--warn); }
  .statusbar.confirmed .dot { background: var(--ok); }
  #statusbar-text { flex: 1; min-width: 0; }
  .jump { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* 절 머리 */
  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 10px; }
  .section-title { margin: 0; font-size: 13px; font-weight: 700; color: var(--text); }
  .progress { font-size: 12px; color: var(--muted); }

  /* 결정 카드 */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
    scroll-margin-top: 16px; transition: border-color .2s, box-shadow .2s;
  }
  .card.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-title { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.4; }
  .card-desc { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .tags { display: flex; gap: 4px; flex: none; }
  .tag {
    font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
  }
  .tag.required { color: var(--text); border-color: var(--line-strong); }
  .pick-tag.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: var(--ok-weak); }

  .options { display: flex; flex-direction: column; gap: 6px; }
  .option {
    display: flex; align-items: flex-start; gap: 12px; min-height: 44px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px;
    background: var(--surface); cursor: pointer; transition: border-color .12s, background .12s;
  }
  .option:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .option.selected { border-color: var(--accent); background: var(--accent-weak); }
  .option .marker {
    flex: none; width: 18px; height: 18px; margin-top: 2px;
    border: 1.5px solid var(--line-strong); background: var(--surface);
    display: grid; place-items: center;
  }
  .option[data-type="single"] .marker { border-radius: 50%; }
  .option[data-type="multi"] .marker { border-radius: 4px; }
  .option.selected .marker { border-color: var(--accent); background: var(--accent); }
  .option[data-type="single"].selected .marker::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-ink); }
  .option[data-type="multi"].selected .marker::after {
    content: ''; width: 5px; height: 9px; margin-top: -2px;
    border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .opt-body { flex: 1; min-width: 0; }
  .opt-label { font-weight: 600; }
  .rec {
    display: inline-block; margin-left: 6px; vertical-align: 1px;
    font-size: 11px; font-weight: 600; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 0 7px;
  }
  .opt-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .custom-input {
    display: none; width: 100%; margin-top: 8px; padding: 8px 10px;
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  }
  .option.selected .custom-input { display: block; }

  /* 확정된 카드 — 고른 것만 보이고, 나머지는 [다른 선택지] 로 펼친다 */
  .card.confirmed .option { cursor: default; }
  .card.confirmed .option:hover { border-color: var(--line); background: var(--surface); }
  .card.confirmed .option.selected { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: var(--ok-weak); }
  .card.confirmed .option.selected .marker { border-color: var(--ok); background: var(--ok); }
  .card.confirmed .option:not(.selected) { display: none; opacity: .6; }
  .card.confirmed.show-all .option:not(.selected) { display: flex; }
  .others { margin-top: 8px; padding: 0; border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
  .others:hover { color: var(--text); }

  .notes-area {
    display: block; width: 100%; min-height: 72px; padding: 10px 12px; resize: vertical;
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  }
  .notes-area::placeholder, .custom-input::placeholder { color: var(--muted); }

  details.preview { margin: 4px 2px 28px; }
  details.preview summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 0; }
  pre.prompt-out {
    margin: 6px 0 0; padding: 14px 16px; border-radius: var(--radius);
    background: var(--code-bg); border: 1px solid var(--line); color: var(--text);
    font: 12.5px/1.6 var(--font-mono); white-space: pre-wrap; word-break: break-word;
  }

  /* 계획서 전문(.md 렌더) */
  details.plan-doc {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    scroll-margin-top: 16px;
  }
  details.plan-doc > summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
    padding: 12px 16px; font-size: 13px; font-weight: 700;
  }
  details.plan-doc > summary::-webkit-details-marker { display: none; }
  details.plan-doc > summary::before {
    content: ''; width: 6px; height: 6px; margin: 0 2px;
    border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s;
  }
  details.plan-doc[open] > summary::before { transform: rotate(45deg); }
  details.plan-doc[open] > summary { border-bottom: 1px solid var(--line); }
  .plan-body { padding: 18px 20px 22px; overflow-wrap: anywhere; }
  @media (min-width: 720px) { .plan-body { padding: 22px 28px 26px; } }
  .plan-body > :first-child { margin-top: 0; }
  .plan-body h1, .plan-body h2, .plan-body h3, .plan-body h4, .plan-body h5, .plan-body h6 {
    line-height: 1.4; letter-spacing: -.01em; margin: 1.5em 0 .5em;
  }
  .plan-body h1 { font-size: 18px; }
  .plan-body h2 { font-size: 16px; }
  .plan-body h3 { font-size: 14.5px; }
  .plan-body h4, .plan-body h5, .plan-body h6 { font-size: 14px; color: var(--muted); }
  .plan-body p { margin: .6em 0; }
  .plan-body ul, .plan-body ol { margin: .5em 0; padding-left: 1.4em; }
  .plan-body li { margin: .2em 0; }
  .plan-body li::marker { color: var(--muted); }
  .plan-body strong { font-weight: 700; }
  .plan-body code {
    font: 12.5px var(--font-mono); background: var(--code-bg); color: var(--text);
    border: 1px solid var(--line); padding: 0 5px; border-radius: 4px;
  }
  .plan-body pre.md-code {
    margin: .8em 0; padding: 12px 14px; overflow-x: auto;
    background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
  }
  .plan-body pre.md-code code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.6; }
  .plan-body blockquote {
    margin: .8em 0; padding: 8px 14px; color: var(--text);
    background: var(--surface-2); border-left: 3px solid var(--line-strong); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .plan-body hr { border: none; border-top: 1px solid var(--line); margin: 1.6em 0; }
  .plan-body table {
    display: block; overflow-x: auto; border-collapse: collapse; margin: .9em 0; font-size: 13px;
  }
  .plan-body th, .plan-body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .plan-body th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }

  /* 하단 고정 바 */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 12px 16px;
  }
  .actionbar-inner { max-width: 832px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status { flex: 1 1 220px; min-width: 0; font-size: 13px; color: var(--muted); }
  .status b { color: var(--text); }
  .status a { white-space: nowrap; }
  .actions { display: flex; gap: 8px; margin-left: auto; }
  button {
    font: 600 13px var(--font-ui); cursor: pointer;
    border-radius: var(--radius-sm); padding: 9px 16px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
    transition: filter .12s, background .12s;
  }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; filter: none; }

  .toast {
    position: fixed; left: 50%; bottom: 84px; z-index: 50;
    transform: translateX(-50%) translateY(16px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="plan-head">
    <div class="meta">
      <span class="badge type" id="p-type"></span>
      <span class="badge scope" id="p-scope"></span>
      <a class="md-link" id="p-mdlink" href="#"></a>
    </div>
    <h1 id="p-title"></h1>
    <p class="plan-summary" id="p-summary"></p>
    <div class="statusbar" id="statusbar">
      <span class="dot"></span><span id="statusbar-text"></span>
      <a class="jump" id="jump-doc" href="#plan-doc" style="display:none">계획서 전문 ↓</a>
    </div>
  </header>

  <section id="decisions-wrap">
    <div class="section-head">
      <h2 class="section-title" id="decisions-title">결정</h2>
      <span class="progress" id="progress"></span>
    </div>
    <div id="decisions"></div>

    <div class="card" id="notes-card">
      <h3 class="card-title">추가 메모 <span class="tag">선택</span></h3>
      <p class="card-desc">결정 외에 전달할 제약 · 우선순위 · 주의사항</p>
      <textarea class="notes-area" id="notes" aria-label="추가 메모" placeholder="예: 마이그레이션은 이번 배포에 넣지 말 것"></textarea>
    </div>

    <details class="preview">
      <summary>보낼 프롬프트 미리보기</summary>
      <pre class="prompt-out" id="preview"></pre>
    </details>
  </section>

  <details class="plan-doc" id="plan-doc" open style="display:none">
    <summary id="body-title">계획서 전문</summary>
    <article class="plan-body" id="plan-body"></article>
  </details>
</div>

<div class="actionbar" id="actionbar">
  <div class="actionbar-inner">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="actions">
      <button id="btn-copy" style="display:none">프롬프트로 복사</button>
      <button class="primary" id="btn-send">이대로 진행</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status">복사되었습니다</div>

<script>
(function () {
  const state = {}; // decisionId -> { picks: Set, custom: '' }

  const el = (tag, cls, html) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html != null) node.innerHTML = html;
    return node;
  };
  const escapeText = (str) => String(str).replace(/[&<>"]/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  // decided 값을 배열로 정규화
  const decidedList = (dec) => {
    if (dec.decided == null) return null;
    return Array.isArray(dec.decided) ? dec.decided : [dec.decided];
  };
  const isConfirmed = (dec) => decidedList(dec) !== null;
  // 모든 필수 결정에 decided 가 채워졌는가 → 확정 모드
  const allConfirmed = () => PLAN.decisions.length > 0 &&
    PLAN.decisions.every((dec) => !dec.required || isConfirmed(dec));

  // --- 머리 ---
  const TYPE_LABELS = { feature: '기능', bugfix: '버그 수정', refactor: '리팩터링', task: '작업' };
  document.getElementById('p-title').textContent = PLAN.title;
  document.title = PLAN.title + ' — 작업계획서';
  document.getElementById('p-summary').textContent = PLAN.summary || '';
  const typeBadge = document.getElementById('p-type');
  typeBadge.textContent = TYPE_LABELS[PLAN.type] || PLAN.type;
  typeBadge.classList.add('type-' + PLAN.type);
  const scopeBadge = document.getElementById('p-scope');
  if (PLAN.scope && PLAN.scope !== '-') scopeBadge.textContent = '영향 범위 · ' + PLAN.scope;
  else scopeBadge.remove();
  const mdLink = document.getElementById('p-mdlink');
  mdLink.innerHTML = '원본 <code>' + escapeText(PLAN.mdFile.split('/').pop()) + '</code>';
  mdLink.title = PLAN.mdFile;
  mdLink.href = PLAN.mdFile.split('/').pop();

  // --- 결정 카드 ---
  const container = document.getElementById('decisions');
  PLAN.decisions.forEach((dec) => {
    const confirmed = isConfirmed(dec);
    const preset = decidedList(dec) || [];
    state[dec.id] = { picks: new Set(preset), custom: '' };

    const card = el('div', 'card' + (confirmed ? ' confirmed' : ''));
    card.dataset.id = dec.id;
    card.id = 'decision-' + dec.id;
    const tags = (dec.required ? '<span class="tag required">필수</span>' : '') +
      '<span class="tag pick-tag">' + (dec.type === 'multi' ? '복수 선택' : '택1') + '</span>';
    card.appendChild(el('div', 'card-head',
      '<h3 class="card-title">' + escapeText(dec.title) + '</h3><span class="tags">' + tags + '</span>'));
    if (dec.desc) card.appendChild(el('p', 'card-desc', escapeText(dec.desc)));
    else card.querySelector('.card-head').style.marginBottom = '12px';

    const opts = el('div', 'options');
    opts.setAttribute('role', dec.type === 'multi' ? 'group' : 'radiogroup');
    opts.setAttribute('aria-label', dec.title);
    dec.options.forEach((opt) => {
      const row = el('div', 'option');
      row.dataset.type = dec.type;
      row.setAttribute('role', dec.type === 'multi' ? 'checkbox' : 'radio');
      if (preset.includes(opt.label)) row.classList.add('selected');
      row.setAttribute('aria-checked', String(preset.includes(opt.label)));
      const rec = opt.recommended ? '<span class="rec">추천</span>' : '';
      const desc = opt.desc ? '<div class="opt-desc">' + escapeText(opt.desc) + '</div>' : '';
      const customField = opt.custom
        ? '<input class="custom-input" placeholder="직접 입력" aria-label="' + escapeText(opt.label) + ' — 직접 입력" />' : '';
      row.innerHTML =
        '<div class="marker" aria-hidden="true"></div>' +
        '<div class="opt-body"><div class="opt-label">' + escapeText(opt.label) + rec + '</div>' +
        desc + customField + '</div>';
      if (!confirmed) {
        row.tabIndex = 0;
        row.addEventListener('click', (ev) => {
          if (ev.target.classList.contains('custom-input')) return;
          toggle(dec, opt, row, opts);
        });
        row.addEventListener('keydown', (ev) => {
          if (ev.target !== row || (ev.key !== ' ' && ev.key !== 'Enter')) return;
          ev.preventDefault();
          toggle(dec, opt, row, opts);
        });
        const customInput = row.querySelector('.custom-input');
        if (customInput) customInput.addEventListener('input', () => {
          state[dec.id].custom = customInput.value;
          render();
        });
      }
      opts.appendChild(row);
    });
    card.appendChild(opts);
    // 확정된 카드는 고른 것만 — 나머지는 펼쳐 볼 수 있게
    const others = dec.options.length - preset.filter((label) => dec.options.some((opt) => opt.label === label)).length;
    if (confirmed && others > 0) {
      const more = el('button', 'others', '다른 선택지 ' + others + '개 보기');
      more.type = 'button';
      more.addEventListener('click', () => {
        const open = card.classList.toggle('show-all');
        more.textContent = open ? '다른 선택지 접기' : '다른 선택지 ' + others + '개 보기';
      });
      card.appendChild(more);
    }
    container.appendChild(card);
  });

  function toggle(dec, opt, row, opts) {
    const picks = state[dec.id].picks;
    if (dec.type === 'single') {
      picks.clear();
      opts.querySelectorAll('.option').forEach((node) => {
        node.classList.remove('selected');
        node.setAttribute('aria-checked', 'false');
      });
      picks.add(opt.label);
      row.classList.add('selected');
    } else if (picks.has(opt.label)) {
      picks.delete(opt.label);
      row.classList.remove('selected');
    } else {
      picks.add(opt.label);
      row.classList.add('selected');
    }
    row.setAttribute('aria-checked', String(row.classList.contains('selected')));
    const customInput = row.querySelector('.custom-input');
    if (customInput && row.classList.contains('selected')) customInput.focus();
    render();
  }

  // --- 선택 결과 → 텍스트 ---
  function valueFor(dec) {
    const st = state[dec.id];
    const labels = [...st.picks].map((label) => {
      const opt = dec.options.find((option) => option.label === label);
      if (opt && opt.custom && st.custom.trim()) return st.custom.trim();
      return label;
    });
    return labels.join(', ');
  }

  function unresolved() {
    return PLAN.decisions.filter((dec) => dec.required && state[dec.id].picks.size === 0);
  }

  function buildPrompt() {
    const lines = [];
    lines.push('[작업계획서 결정사항 확정] ' + PLAN.title);
    lines.push('');
    lines.push('아래 결정사항으로 ' + PLAN.mdFile + ' 계획서를 확정하고 진행해주세요.');
    lines.push('');
    PLAN.decisions.forEach((dec, idx) => {
      const val = valueFor(dec) || '(미결정)';
      lines.push((idx + 1) + '. ' + dec.title + ': ' + val);
    });
    const notes = document.getElementById('notes').value.trim();
    lines.push('');
    lines.push('추가 메모: ' + (notes || '(없음)'));
    return lines.join('\n');
  }

  // 남은 필수 결정으로 — 카드를 잠깐 밝힌다
  function jumpTo(dec) {
    const card = document.getElementById('decision-' + dec.id);
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 1200);
    const first = card.querySelector('.option[tabindex]');
    if (first) first.focus({ preventScroll: true });
  }

  function render() {
    PLAN.decisions.forEach((dec) => {
      const card = container.querySelector('[data-id="' + dec.id + '"]');
      const tag = card.querySelector('.pick-tag');
      const decided = state[dec.id].picks.size > 0;
      if (decided) {
        tag.classList.add('done');
        tag.textContent = isConfirmed(dec) ? '확정' : '골랐음';
      } else {
        tag.classList.remove('done');
        tag.textContent = dec.type === 'multi' ? '복수 선택' : '택1';
      }
    });
    const required = PLAN.decisions.filter((dec) => dec.required);
    const optional = PLAN.decisions.length - required.length;
    const left = unresolved();
    document.getElementById('progress').textContent =
      (required.length ? '필수 ' + (required.length - left.length) + '/' + required.length : '') +
      (required.length && optional ? ' · ' : '') + (optional ? '선택 ' + optional + '개' : '');
    const status = document.getElementById('status');
    if (sent) status.innerHTML = '<b>' + escapeText(PLAN.leadPane) + ' 에 보냈어요.</b> 확정되면 이 화면이 잠깁니다.';
    else if (sendError) status.innerHTML = escapeText(sendError) + ' — 복사해서 ' + escapeText(PLAN.leadPane || '담당') + ' pane 에 붙여넣어 주세요.';
    else if (left.length === 0) status.innerHTML = '<b>모두 골랐어요.</b> ' + escapeText(PLAN.leadPane) + ' pane 에 보냅니다.';
    else {
      status.innerHTML = '필수 <b>' + left.length + '개</b> 남음 · ';
      const link = el('a', '', escapeText(left[0].title) + '로 이동');
      link.href = '#decision-' + left[0].id;
      link.addEventListener('click', (ev) => { ev.preventDefault(); jumpTo(left[0]); });
      status.appendChild(link);
    }
    if (!allConfirmed()) {
      document.getElementById('statusbar-text').innerHTML = left.length
        ? '<b>결정 대기</b> · 필수 ' + left.length + '개를 고르고 [이대로 진행]'
        : '<b>결정 대기</b> · 다 골랐어요 — 아래 [이대로 진행] 으로 보내 주세요';
    }
    document.getElementById('btn-copy').disabled = left.length > 0;
    document.getElementById('btn-send').disabled = left.length > 0 || sent || sending;
    document.getElementById('preview').textContent = buildPrompt();
  }

  // --- 라이프사이클: 결정 콘솔 / 확정 뷰 ---
  function applyLifecycle() {
    const confirmed = allConfirmed();
    const bar = document.getElementById('statusbar');
    const barText = document.getElementById('statusbar-text');
    if (confirmed) {
      bar.className = 'statusbar confirmed';
      barText.innerHTML = '<b>확정됨</b> · 아래 결정대로 진행합니다';
      document.getElementById('decisions-title').textContent = '확정된 결정';
      // 확정되면 메모 · 미리보기 · 액션 바를 감춰 읽기용으로
      document.getElementById('notes-card').style.display = 'none';
      document.querySelector('details.preview').style.display = 'none';
      document.getElementById('actionbar').style.display = 'none';
      document.querySelector('.wrap').style.paddingBottom = '48px';
    } else {
      bar.className = 'statusbar pending'; // 글은 render() 가 고른 상태에 맞춰 쓴다
    }
    if (!PLAN.decisions.length) document.getElementById('decisions-wrap').style.display = 'none';
  }

  // --- .md 본문 ---
  renderPlanBody();
  function renderPlanBody() {
    let raw = (document.getElementById('plan-md').textContent || '').trim();
    if (!raw) return;
    // 맨 앞 # 제목이 PLAN.title 과 같으면 뺀다 — 머리에 이미 있다
    const first = raw.match(/^#\s+(.+)\n?/);
    if (first && first[1].trim() === String(PLAN.title).trim()) raw = raw.slice(first[0].length).trim();
    document.getElementById('plan-doc').style.display = '';
    document.getElementById('jump-doc').style.display = '';
    document.getElementById('plan-body').innerHTML = miniMarkdown(raw);
  }
  document.getElementById('jump-doc').addEventListener('click', (ev) => {
    ev.preventDefault();
    const doc = document.getElementById('plan-doc');
    doc.open = true;
    doc.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // 의존성 없는 경량 마크다운 렌더러 (중첩목록 미지원)
  // 따옴표까지 이스케이프한다 — 현황판이 토큰을 넣어 주는 페이지라 본문 링크로 속성이 깨지면 /api/* 를 부를 수 있다
  function mdEscape(str) {
    return String(str).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
  // 링크 주소는 http(s)·상대 경로·# 만 허용한다 (javascript:·data: 등 스킴은 링크로 만들지 않는다)
  // 제어문자·공백이 섞이면 거부한다 — URL 파서가 앞의 제어문자를 지워 "\x01javascript:" 가 스킴으로 살아난다
  function safeHref(href) {
    const decoded = href.replace(/&amp;/g, '&');
    if (/[\u0000- \u007f-\u009f]/.test(decoded)) return null;
    if (/^https?:\/\//i.test(decoded)) return href;
    // 첫 / ? # 앞에 : 가 없으면 상대 경로다
    const head = decoded.split(/[/?#]/)[0];
    return head.includes(':') ? null : href;
  }
  function mdInline(str) {
    let out = mdEscape(str);
    out = out.replace(/`([^`]+)`/g, (m, code) => '<code>' + code + '</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, href) => {
      const safe = safeHref(href);
      return safe ? '<a href="' + safe + '">' + text + '</a>' : text;
    });
    return out;
  }
  function mdSplitRow(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim());
  }
  function miniMarkdown(src) {
    const lines = src.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let idx = 0;
    const isSpecial = (line) =>
      /^(#{1,6})\s/.test(line) || /^```/.test(line) || /^\s*\|.*\|\s*$/.test(line) ||
      /^\s*([-*])\s+/.test(line) || /^\s*\d+\.\s+/.test(line) || /^\s*---+\s*$/.test(line) ||
      /^\s*>/.test(line) || /^\s*$/.test(line);

    while (idx < lines.length) {
      const line = lines[idx];

      // 코드 펜스
      if (/^```/.test(line)) {
        idx += 1;
        const buf = [];
        while (idx < lines.length && !/^```/.test(lines[idx])) { buf.push(lines[idx]); idx += 1; }
        idx += 1;
        html += '<pre class="md-code"><code>' + mdEscape(buf.join('\n')) + '</code></pre>';
        continue;
      }
      // 표 (헤더 + 구분선)
      if (/^\s*\|.*\|\s*$/.test(line) && idx + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[idx + 1])) {
        const header = mdSplitRow(line);
        idx += 2;
        const rows = [];
        while (idx < lines.length && /^\s*\|.*\|\s*$/.test(lines[idx])) { rows.push(mdSplitRow(lines[idx])); idx += 1; }
        html += '<table><thead><tr>' + header.map((cell) => '<th>' + mdInline(cell) + '</th>').join('') + '</tr></thead><tbody>';
        html += rows.map((row) => '<tr>' + row.map((cell) => '<td>' + mdInline(cell) + '</td>').join('') + '</tr>').join('');
        html += '</tbody></table>';
        continue;
      }
      // 제목
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const level = heading[1].length;
        html += '<h' + level + '>' + mdInline(heading[2]) + '</h' + level + '>';
        idx += 1;
        continue;
      }
      // 구분선
      if (/^\s*---+\s*$/.test(line)) { html += '<hr>'; idx += 1; continue; }
      // 인용
      if (/^\s*>\s?/.test(line)) {
        const buf = [];
        while (idx < lines.length && /^\s*>\s?/.test(lines[idx])) { buf.push(lines[idx].replace(/^\s*>\s?/, '')); idx += 1; }
        html += '<blockquote>' + mdInline(buf.join(' ')) + '</blockquote>';
        continue;
      }
      // 목록
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\.\s+/.test(line);
        const buf = [];
        while (idx < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[idx])) {
          buf.push(lines[idx].replace(/^\s*([-*]|\d+\.)\s+/, '')); idx += 1;
        }
        const items = buf.map((item) => '<li>' + mdInline(item) + '</li>').join('');
        html += ordered ? '<ol>' + items + '</ol>' : '<ul>' + items + '</ul>';
        continue;
      }
      // 빈 줄
      if (/^\s*$/.test(line)) { idx += 1; continue; }
      // 문단
      const buf = [line];
      idx += 1;
      while (idx < lines.length && !isSpecial(lines[idx])) { buf.push(lines[idx]); idx += 1; }
      html += '<p>' + mdInline(buf.join(' ')) + '</p>';
    }
    return html;
  }

  function copy(text) {
    navigator.clipboard.writeText(text).then(showToast).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); showToast();
    });
  }
  let toastTimer;
  function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  // --- [이대로 진행]: 현황판 서버(/api/action)를 거쳐 계획서를 만든 아테나 pane 에 입력한다 ---
  // 토큰은 현황판이 이 파일을 서빙할 때 넣어 준다. file:// 로 열었거나 보낼 pane 이 없으면 복사로 바꾼다
  let sent = false;
  let sending = false;
  let sendError = '';
  const boardToken = window.ATHENA_BOARD_TOKEN || '';
  function fallbackToCopy(reason) {
    sendError = reason;
    document.getElementById('btn-send').style.display = 'none';
    const copyButton = document.getElementById('btn-copy');
    copyButton.style.display = '';
    copyButton.classList.add('primary');
    render();
  }
  async function sendToHermes() {
    sending = true;
    render();
    try {
      const response = await fetch('/api/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Board-Token': boardToken },
        body: JSON.stringify({ pane: PLAN.leadPane, text: buildPrompt() }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || '보내지 못했어요 (' + response.status + ')');
      sent = true;
      document.getElementById('btn-send').textContent = '보냄';
    } catch (error) {
      fallbackToCopy(error.message || '보내지 못했어요');
    } finally {
      sending = false;
      render();
    }
  }
  if (!PLAN.leadPane) fallbackToCopy('보낼 pane 이 계획서에 적혀 있지 않아요');
  else if (!boardToken) fallbackToCopy('현황판 주소로 열지 않아 바로 보낼 수 없어요');
  document.getElementById('btn-send').addEventListener('click', sendToHermes);
  document.getElementById('btn-copy').addEventListener('click', () => copy(buildPrompt()));
  document.getElementById('notes').addEventListener('input', render);

  // 고정 바가 마지막 내용을 가리지 않게 — 바 높이만큼 아래 여백
  const actionbar = document.getElementById('actionbar');
  const wrap = document.querySelector('.wrap');
  const fitBottom = () => {
    if (actionbar.style.display !== 'none') wrap.style.paddingBottom = (actionbar.offsetHeight + 32) + 'px';
  };
  if (window.ResizeObserver) new ResizeObserver(fitBottom).observe(actionbar);

  render();
  applyLifecycle();
  fitBottom();
})();
</script>
</body>
</html>
