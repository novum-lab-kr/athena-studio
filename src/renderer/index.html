<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http://localhost:* http://127.0.0.1:*">
  <title>Athena</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="tabbar">
    <img class="tabbar-logo" src="assets/logo/athena-logo-white.png" alt="Athena Studio" draggable="false">
    <!-- 지금 회사 팩 — 누르면 고르기(본체가 여러 팩을 지원할 때만 보임) -->
    <button id="pack-chip" class="pack-chip" hidden title="팩 고르기" data-i18n-title="pack.chipTitle"><span class="pack-chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h12a1 1 0 0 1 1 1v12.5l-2 2V21H7v-2.5l-2-2V4a1 1 0 0 1 1-1z"/><path d="M8.5 7h7v5h-7z"/><path d="M9 18.5v2M12 18.5v2M15 18.5v2"/></svg></span><span id="pack-name"></span><span class="pack-chip-caret" aria-hidden="true">▾</span></button>
    <button class="tab" data-tab="work" aria-selected="true"><span data-i18n="tabs.work">🖥 작업 창</span> <kbd data-key="1"></kbd></button>
    <button class="tab" data-tab="board" aria-selected="false"><span data-i18n="tabs.board">📋 현황판</span> <kbd data-key="2"></kbd></button>
    <span class="spacer"></span>
    <button id="browser-toggle" class="tabbar-tool" title="옆 브라우저 열기·닫기" aria-label="옆 브라우저 열기·닫기" data-i18n-title="browser.toggle" data-i18n-aria-label="browser.toggle" aria-controls="browser" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><ellipse cx="8" cy="8" rx="2.75" ry="6.25"/><path d="M1.9 6h12.2M1.9 10h12.2"/></svg>
    </button>
  </header>

  <main>
    <section id="setup" class="panel setup" hidden>
      <img class="setup-logo" src="assets/logo/athena-logo-white.png" alt="" draggable="false">
      <div id="spinner" class="spinner" hidden></div>
      <h1 id="setup-title">Athena Studio</h1>
      <p id="setup-note" hidden><span data-i18n="setup.note">끝나면 바로 작업 창이 열려요.</span><br>
        <code id="install-dir"></code></p>
      <p id="setup-error" class="error" hidden></p>
      <button id="install" class="primary" hidden data-i18n="common.retry">다시 시도</button>
      <button id="pick" class="link" hidden data-i18n="setup.pick">이미 받은 아테나 폴더 고르기…</button>
    </section>

    <section id="work" class="panel">
      <aside id="spaces" class="spaces" aria-label="작업 공간" data-i18n-aria-label="spaces.label"></aside>
      <div class="center">
        <nav id="studio-tabs" class="studio-tabs"></nav>
        <div class="work-area">
          <div id="panes" class="panes"></div>
          <!-- 회사 팩이 하나도 없을 때 — VS Code 시작 화면처럼 작업 창 가운데에(모달 아님) -->
          <!-- 시작 화면 — 팩이 없을 때 · 켤 때마다(팩이 있어도 · 도는 에이전트가 없으면) · 작업 창 가운데(VS Code 처럼) · 밤하늘(2026-10-18 확정) -->
          <section id="pack-welcome" class="pack-welcome" hidden>
            <div class="night-stars" aria-hidden="true"><i class="star" style="left:8%;top:14%;--d:3.24s;--delay:-0.68s;--s:2px"></i><i class="star" style="left:17%;top:72%;--d:4.09s;--delay:-0.33s;--s:2px"></i><i class="star bright" style="left:23%;top:30%;--d:3.79s;--delay:-1.65s;--s:3px"></i><i class="star bright" style="left:77%;top:12%;--d:2.58s;--delay:-0.41s;--s:3px"></i><i class="star bright" style="left:92%;top:66%;--d:2.72s;--delay:-1.0s;--s:3px"></i><i class="star" style="left:64%;top:20%;--d:3.9s;--delay:-1.79s;--s:2px"></i></div>
            <div class="pack-welcome-inner">
              <img class="pack-welcome-logo" src="assets/logo/athena-logo-white.png" alt="" draggable="false">
              <h1>Athena</h1>
              <button class="pack-welcome-action" data-pack-command="new"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h12a1 1 0 0 1 1 1v12.5l-2 2V21H7v-2.5l-2-2V4a1 1 0 0 1 1-1z"/><path d="M8.5 7h7v5h-7z"/><path d="M9 18.5v2M12 18.5v2M15 18.5v2"/></svg></span><span><b data-i18n="pack.welcome.new">새 팩 만들기</b><small data-i18n="pack.welcome.newNote">이 컴퓨터의 레포를 찾아 팩을 만들어요</small></span></button>
              <button class="pack-welcome-action" data-pack-command="import"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10"/><path d="M8 9.5 12 13.5 16 9.5"/><path d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14"/></svg></span><span><b data-i18n="pack.welcome.import">팩 가져오기</b><small data-i18n="pack.welcome.importNote">압축 파일 · 폴더 · Git 주소 · 기존 아테나</small></span></button>
              <!-- 내 팩 — 지금 팩 맨 위 · 최근 순 · 최대 5개(renderer renderWelcomeRecent) · 고르면 그 팩으로 들어간다 -->
              <div id="pack-welcome-recent" class="pack-welcome-recent" hidden>
                <div class="pack-welcome-recent-head"><span data-i18n="pack.welcome.recentTitle">내 팩</span><button class="link" data-pack-command="picker" data-i18n="pack.welcome.recentAll">모두 보기…</button></div>
                <div id="pack-welcome-recent-list"></div>
              </div>
            </div>
          </section>
          <!-- 미리보기 — 터미널 옆에 나눠 띄운다(덮지 않는다) -->
          <div id="preview" class="preview" tabindex="-1" hidden>
            <header class="preview-head">
              <span id="preview-title" class="preview-title"></span>
              <button id="preview-close" class="preview-close" title="닫기 (Esc)" data-i18n-title="common.closeEsc">✕</button>
            </header>
            <pre id="preview-body" class="preview-body"></pre>
          </div>
        </div>
        <div id="screen-status" class="screen-status" hidden></div>
        <!-- 가운데 맨 아래 — 에이전트 모니터(앱 화면 · Claude 기록을 main 이 따라 읽는다 · athena 작업 공간에서만 보임) -->
        <section id="dock" class="dock monitor">
          <div class="monitor-head">
            <span class="monitor-title"><svg class="monitor-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg>AGENT MONITOR</span>
            <div id="monitor-sessions" class="monitor-sessions"></div>
            <button id="monitor-fold" class="monitor-fold" title="에이전트 모니터 접기·펴기" aria-label="에이전트 모니터 접기·펴기" data-i18n-title="monitor.fold" data-i18n-aria-label="monitor.fold"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="panel-fill" d="M3 15h18v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M3 15h18"/></svg></button>
          </div>
          <div id="monitor-feed" class="monitor-feed"></div>
        </section>
      </div>
      <aside id="side-panel" class="side-panel" aria-label="오른쪽 패널" data-i18n-aria-label="side.label"></aside>
      <!-- 오른쪽을 접으면 남는 좁은 줄 — 누르면 다시 편다 -->
      <aside id="side-rail" class="side-rail" hidden>
        <button id="side-open" class="rail-button" title="Explorer 펴기" data-i18n-title="side.open">
          <svg class="rail-panel" viewBox="0 0 24 24" aria-hidden="true"><path class="panel-fill" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4z"/><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M15 3v18"/></svg>
        </button>
      </aside>
      <div id="toast" class="toast" hidden></div>
    </section>

    <section id="board" class="panel" hidden>
      <div id="board-status" class="status"></div>
      <iframe id="board-frame" title="현황판" data-i18n-title="board.title" hidden></iframe>
    </section>

    <!-- 오른쪽에서 스르륵 나오는 옆 브라우저 — 페이지는 main 의 WebContentsView 가 #browser-slot 자리에 그린다 -->
    <aside id="browser" class="browser" hidden>
      <div id="browser-resize" class="browser-resize" title="끌어서 너비 바꾸기 · 더블클릭하면 기본 너비" data-i18n-title="browser.resizeHint"></div>
      <div class="browser-bar">
        <button id="browser-back" title="뒤로" data-i18n-title="browser.back" disabled>◀</button>
        <button id="browser-forward" title="앞으로" data-i18n-title="browser.forward" disabled>▶</button>
        <button id="browser-reload" title="새로고침" data-i18n-title="common.reload">⟳</button>
        <input id="browser-url" class="browser-url" spellcheck="false" autocomplete="off" placeholder="주소 — localhost:3000 · 계획서 링크 · https://…" data-i18n-placeholder="browser.urlPlaceholder">
        <button id="browser-external" title="기본 브라우저로 열기" data-i18n-title="browser.external">↗</button>
        <button id="browser-close" title="닫기" data-i18n-title="common.close">✕</button>
      </div>
      <div id="browser-error" class="browser-error" hidden></div>
      <div id="browser-slot" class="browser-slot"></div>
    </aside>
  </main>
  <!-- 회사 팩 대화상자 · 진행 표시 — 창 전체 위에(처음 켤 때 화면 포함) -->
  <div id="pack-dialog" class="pack-overlay" hidden role="dialog" aria-modal="true">
    <div class="pack-box">
      <h2 id="pack-dialog-title"></h2>
      <div id="pack-dialog-body" class="pack-body"></div>
      <div id="pack-dialog-actions" class="pack-actions"></div>
    </div>
  </div>
  <div id="pack-progress" class="pack-overlay" hidden>
    <div class="pack-box">
      <div class="spinner"></div>
      <h2 id="pack-progress-title"></h2>
      <p id="pack-progress-step" class="pack-step"></p>
      <div class="pack-actions"><button id="pack-progress-cancel" class="link" hidden data-i18n="common.cancel">취소</button></div>
    </div>
  </div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../lib/layout.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
