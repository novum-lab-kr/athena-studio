<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http://localhost:* http://127.0.0.1:*">
  <title>Athena Studio</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="tabbar">
    <button class="tab" data-tab="work" aria-selected="true">🖥 작업 창 <kbd data-key="1"></kbd></button>
    <button class="tab" data-tab="board" aria-selected="false">📋 현황판 <kbd data-key="2"></kbd></button>
    <span class="spacer"></span>
    <span id="athena-dir" class="dir" title="아테나 폴더"></span>
  </header>

  <main>
    <section id="setup" class="panel setup" hidden>
      <div id="spinner" class="spinner" hidden></div>
      <h1 id="setup-title">Athena Studio</h1>
      <p id="setup-note" hidden>끝나면 바로 작업 창이 열려요.<br>
        <code id="install-dir"></code></p>
      <p id="setup-progress" class="progress" hidden></p>
      <p id="setup-error" class="error" hidden></p>
      <button id="install" class="primary" hidden>다시 받기</button>
      <button id="pick" class="link" hidden>이미 받은 아테나 폴더 고르기…</button>
    </section>

    <section id="work" class="panel">
      <aside id="spaces" class="spaces" aria-label="작업 공간"></aside>
      <div class="center">
        <nav id="studio-tabs" class="studio-tabs"></nav>
        <div class="work-area">
          <div id="panes" class="panes"></div>
          <!-- 미리보기 — 터미널 옆에 나눠 띄운다(덮지 않는다) -->
          <div id="preview" class="preview" tabindex="-1" hidden>
            <header class="preview-head">
              <span id="preview-title" class="preview-title"></span>
              <button id="preview-close" class="preview-close" title="닫기 (Esc)">✕</button>
            </header>
            <pre id="preview-body" class="preview-body"></pre>
          </div>
        </div>
        <div id="screen-status" class="screen-status" hidden></div>
      </div>
      <aside id="side-panel" class="side-panel" aria-label="오른쪽 패널"></aside>
      <!-- 오른쪽을 접으면 남는 좁은 줄 — 누르면 다시 편다 -->
      <aside id="side-rail" class="side-rail" hidden>
        <button id="side-open" class="rail-button" title="Explorer 펴기">
          <img class="rail-icon" src="../../node_modules/material-icon-theme/icons/folder-open.svg" alt="">
          <span class="rail-arrow">«</span>
        </button>
      </aside>
      <div id="toast" class="toast" hidden></div>
      <div id="agent-picker" class="picker" hidden>
        <div class="picker-box">
          <h2>어떤 에이전트로 아테나를 켤까요?</h2>
          <div id="agent-options" class="picker-options"></div>
        </div>
      </div>
    </section>

    <section id="board" class="panel" hidden>
      <div id="board-status" class="status">현황판을 여는 중…</div>
      <iframe id="board-frame" title="현황판" hidden></iframe>
    </section>
  </main>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../lib/layout.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
