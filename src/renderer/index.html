<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http://localhost:* http://127.0.0.1:*">
  <title>Athena Studio</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="tabbar">
    <button class="tab" data-tab="work" aria-selected="true">🖥 작업 창 <kbd data-key="1"></kbd></button>
    <button class="tab" data-tab="board" aria-selected="false">📋 현황판 <kbd data-key="2"></kbd></button>
    <span class="spacer"></span>
    <span id="athena-dir" class="dir" title="아테나 폴더"></span>
  </header>

  <main>
    <section id="setup" class="panel setup" hidden>
      <h1>Athena Studio</h1>
      <p>처음 한 번, 아테나 폴더를 골라 주세요.<br>
        <code>CLAUDE.md</code> 와 <code>scripts/board/server.mjs</code> 가 있는 폴더예요.</p>
      <button id="pick" class="primary">아테나 폴더 고르기…</button>
      <p id="setup-error" class="error" hidden></p>
    </section>

    <section id="work" class="panel">
      <div id="terminal"></div>
    </section>

    <section id="board" class="panel" hidden>
      <div id="board-status" class="status">현황판을 여는 중…</div>
      <iframe id="board-frame" title="현황판" hidden></iframe>
    </section>
  </main>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
