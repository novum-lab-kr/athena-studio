<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Athena</title>
  <link rel="stylesheet" href="tray.css">
</head>
<body>
  <!-- 메뉴 막대 패널(사용자가 고른 ★ Claude 추천) — 확인 필요 배너 · 작업 공간별 에이전트 · 사용량 링 · 칸반 숫자 -->
  <div class="panel">
    <header id="hd" class="hd">
      <img class="logo" src="assets/logo/athena-logo-white.png" alt="" draggable="false">
      <b>Athena</b>
      <svg id="spark" class="spark" viewBox="0 0 100 14" preserveAspectRatio="none"><path id="spark-path"></path></svg>
      <span id="conn" class="conn"></span>
      <span id="bell" class="bell" hidden>🔕</span>
      <button id="menu" class="menu" title="메뉴">☰</button>
    </header>
    <div id="body" class="body"></div>
  </div>
  <script src="tray.js"></script>
</body>
</html>
