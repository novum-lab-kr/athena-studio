# 넘긴 작업을 검증해 기준 브랜치에 머지한다(athena/docs/pr-auto.md "Actions 로 넘기기" · 틀 athena/docs/templates/actions/athena-handoff.yml). 팩 actionsHandoff 를 켜야 쓰인다.
# 시작: ship.sh 가 작업 HEAD 위에 계획서 제목을 담은 빈 커밋(넘김 머리)을 얹어 handoff/<브랜치> 로 push 한다 — 아래 머지 단계는 그 제목을 squash 제목으로 쓴다. pull_request 로 시작하지 않으니 포크 PR 에서는 돌지 않는다.
# 차례: 머지는 강제 없는 push 라 앞선 머지와 겹치면 거부되고 다시 합쳐 본다. concurrency 로 줄 세우지 않는다 — GitHub 은 대기 실행을 하나만 남기고 취소해 넘긴 일이 사라진다.
# 공개 레포는 로그가 누구에게나 보인다 — 검증 단계에서 비밀값을 출력하지 않고, 꼭 필요한 값만 그 단계 env 로 넘긴다.
name: athena-handoff
on:
  push:
    branches: ['handoff/**']
permissions:
  contents: read
# 같은 브랜치를 다시 넘기면 옛 실행은 필요 없다 — 다른 브랜치끼리는 막지 않는다
concurrency:
  group: athena-handoff-${{ github.ref }}
  cancel-in-progress: true
env:
  BASE_BRANCH: main
  DEPLOY_WORKFLOW: release.yml # 기본 토큰으로 머지하면 release.yml 의 push 가 걸리지 않아 직접 부른다 — 버전 태그 · Release
jobs:
  verify:
    if: github.event.deleted == false && github.event.repository.fork == false
    # 맥 러너 — 데몬 통합 시험은 node-pty prebuild 가 darwin · win32 뿐이라 리눅스에서 skip 된다(test/daemon.test.js)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Electron 44 의 Node 와 같은 줄 · .mts 타입 지우기(22.18+)
          cache: npm
      # 전체 검증 — 팩 scripts/verify/athena-studio.sh 의 전체 모드와 같은 단계(그 스크립트는 팩에 있어 레포 체크아웃에 없다)
      - name: 설치
        run: npm ci --no-audit --no-fund
      - name: 문법 · 화면 빌드
        run: npm run check
      - name: 타입 검사
        run: npm run typecheck
      - name: 앱 시험 · 데몬 통합 시험 skip 없음
        shell: bash
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
          skipped="$(grep -Eo 'skipped [0-9]+' "$RUNNER_TEMP/npm-test.log" | tail -1 | grep -Eo '[0-9]+')"
          [ "$skipped" = 0 ] || { echo "::error::시험 skip $skipped — 데몬 통합 시험이 돌지 않았을 수 있다"; exit 1; }
      - name: 코어 시험
        shell: bash
        working-directory: athena
        run: |
          # 시험이 임시 레포에 커밋한다
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ls test/*.sh | grep -v '/_lib\.sh$' | xargs -P 3 -n 1 bash
  merge:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 같은 HEAD 를 squash 로 머지
        # >>> merge
        run: |
          work_branch="${GITHUB_REF_NAME#handoff/}"
          subject="$(git log -1 --format=%s "$GITHUB_SHA")"
          export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
          GIT_AUTHOR_NAME="$(git log -1 --format=%an "$GITHUB_SHA")"
          GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "$GITHUB_SHA")"
          GIT_COMMITTER_NAME='github-actions[bot]'
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          merged=0
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$BASE_BRANCH"
            base_sha="$(git rev-parse FETCH_HEAD)"
            if git merge-base --is-ancestor "$GITHUB_SHA" "$base_sha"; then
              echo "이미 $BASE_BRANCH 에 들어 있다"
              merged=1
              break
            fi
            merge_status=0
            tree="$(git merge-tree --write-tree --no-messages "$base_sha" "$GITHUB_SHA")" || merge_status=$?
            if [ "$merge_status" = 1 ]; then
              echo "::error::$BASE_BRANCH 와 충돌 — 기준 브랜치를 합쳐 푼 뒤 다시 넘긴다"
              exit 1
            fi
            [ "$merge_status" = 0 ] || { echo "::error::충돌 확인을 못 함"; exit 1; }
            tree="${tree%%$'\n'*}"
            if [ "$tree" = "$(git rev-parse "$base_sha^{tree}")" ]; then
              echo "이미 $BASE_BRANCH 에 들어 있다"
              merged=1
              break
            fi
            commit_sha="$(git commit-tree "$tree" -p "$base_sha" -m "$subject" -m "$work_branch → $BASE_BRANCH 넘겨서 머지(PR 없음 · squash)")"
            if git push --quiet origin "$commit_sha:refs/heads/$BASE_BRANCH"; then
              echo "머지함 @$commit_sha"
              merged=1
              break
            fi
            echo "push 거부 — 다시 합쳐 본다($attempt/5)"
            sleep "$((attempt * 5))"
          done
          [ "$merged" = 1 ] || { echo "::error::$BASE_BRANCH 에 push 하지 못했다"; exit 1; }
          git push --quiet origin --delete "$GITHUB_REF_NAME" || echo "넘김 브랜치를 지우지 못했다 — 머지는 끝났다"
        # <<< merge
  deploy:
    needs: merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # 기본 토큰으로 한 push 는 다른 workflow 를 시작하지 않는다. workflow_dispatch 는 예외라 여기서 직접 부른다
      - name: 배포 시작
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$DEPLOY_WORKFLOW" ] || { echo '부를 배포 없음'; exit 0; }
          gh workflow run "$DEPLOY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$BASE_BRANCH"
