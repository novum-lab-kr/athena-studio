# main 에 머지될 때마다 버전 태그 vX.Y.Z + GitHub Release(결정 D2 · D4 — plans/feature/20261026-버저닝).
# 사람이 GitHub 에서 머지해도 · 자동 머지 흐름이 머지해도 push → main 이라 똑같이 걸린다. 계산은 scripts/release-version.js(src/lib/version.js)
# 태그 뒤 앱이 바뀐 판이면(공개판 태그와 비교 · scripts/release-changed.js · 계획서 20261106 D2) release-mac.yml 을 그 태그로 부른다 — 빌드 → 공개 레포 Release
name: release
on:
  push:
    branches: [main]
  # Actions 로 넘긴 머지는 기본 토큰이라 push 로 시작하지 않는다 — athena-handoff.yml 이 직접 부른다
  workflow_dispatch:
permissions:
  contents: write # 태그 · Release 만들기
  pull-requests: read # 머지 커밋의 PR 제목 읽기(gh api …/commits/<sha>/pulls)
  actions: write # release-mac.yml 부르기(workflow_dispatch — 기본 토큰으로도 다른 workflow 를 깨운다)
# 머지가 몰려도 하나씩 — 앞 태그를 보고 다음 번호를 정한다. GitHub 은 대기 실행을 하나만 남기고 나머지를 취소하지만,
# 스크립트가 기준 태그 뒤 아직 태그 없는 main 커밋을 모두 차례로 처리하므로 취소된 실행의 머지도 다음 실행이 채운다
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 버전 태그 · Release
        run: node scripts/release-version.js --sha "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 앱이 바뀐 판인가
        id: scope
        # 앞 단계가 gh 로 만든 태그는 이 체크아웃에 없다 — 받아 온 뒤 공개판 태그와 비교한다
        run: |
          git fetch --quiet --tags --force origin
          node scripts/release-changed.js --sha "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 맥 배포판 · 공개 부르기
        if: steps.scope.outputs.build == 'true'
        # 그 버전 태그로 부른다 — main 이 그사이 더 나가도 태그 커밋을 만든다. 같은 release-mac 이 줄 서 있으면 GitHub 이 대기 하나만 남긴다(새것이 옛 변경까지 싣는다)
        run: gh workflow run release-mac.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION" -f version="$VERSION" -f release=true -f publish=true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.scope.outputs.version }}
