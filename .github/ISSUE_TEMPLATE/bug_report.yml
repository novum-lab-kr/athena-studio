name: Bug report
description: Something in Athena Studio isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Do not paste secrets, tokens, API keys, passwords or your company's source code** anywhere in this issue — issues are public.
        If you found a security problem, do not open a public issue. Report it privately as described in [SECURITY.md](https://github.com/novum-lab-kr/athena-studio/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Athena Studio version
      description: In the menu bar, choose **Athena → About Athena** to see the version.
      placeholder: e.g. 0.15.2
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: e.g. macOS 15.1
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots (optional)
      description: Paste relevant log lines or attach screenshots. Remove any secrets, tokens or company code first.
    validations:
      required: false
